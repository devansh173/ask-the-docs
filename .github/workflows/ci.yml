name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_generation_eval:
        description: "Also run the LLM-judged generation gate (costs money)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------- #
  # Tier 1: free. Retrieval quality is gated on every push.
  # ---------------------------------------------------------------------- #
  test:
    name: tests + retrieval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install --no-deps -e .

      # Model weights are ~1.1 GB of ONNX. Caching them keeps the job at a
      # couple of minutes instead of re-downloading on every run.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: models-bge-small-${{ hashFiles('src/askthedocs/config.py') }}
          restore-keys: models-bge-small-

      - name: Unit tests
        env:
          EMBEDDING_MODEL: bge-small
          RERANKER_MODEL: none
        run: pytest tests/test_retrieval.py -v

      - name: Validate the golden set
        run: python -m askthedocs.evals.build_golden --validate

      # The corpus is not committed, so CI rebuilds it. Scraping live docs in
      # CI would make the gate depend on three third-party sites being up and
      # unchanged, so the cached corpus is restored where possible and only
      # re-fetched when the source definitions change.
      - name: Cache scraped corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: data/raw
          key: corpus-${{ hashFiles('src/askthedocs/ingest/sources.py') }}

      - name: Scrape
        if: steps.corpus.outputs.cache-hit != 'true'
        run: python -m askthedocs.cli scrape

      - name: Index
        env:
          EMBEDDING_MODEL: bge-small
          RERANKER_MODEL: none
        run: python -m askthedocs.cli index --recreate

      - name: Retrieval regression gate
        env:
          EMBEDDING_MODEL: bge-small
          RERANKER_MODEL: none
        run: pytest tests/test_regression.py -v -m "not eval"

      - name: Full retrieval report
        env:
          EMBEDDING_MODEL: bge-small
          RERANKER_MODEL: none
        run: python -m askthedocs.evals.run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals_out/
          retention-days: 30

  # ---------------------------------------------------------------------- #
  # Tier 2: costs money. Manual dispatch, or nightly on main.
  # ---------------------------------------------------------------------- #
  generation-eval:
    name: generation gate (LLM judge)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_generation_eval

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install --no-deps -e .

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: models-bge-small-${{ hashFiles('src/askthedocs/config.py') }}
          restore-keys: models-bge-small-

      - uses: actions/cache@v4
        with:
          path: data/raw
          key: corpus-${{ hashFiles('src/askthedocs/ingest/sources.py') }}

      - name: Scrape if needed
        run: test -d data/raw || python -m askthedocs.cli scrape

      - name: Index
        env:
          EMBEDDING_MODEL: bge-small
          RERANKER_MODEL: none
        run: python -m askthedocs.cli index --recreate

      - name: Faithfulness / relevancy gate
        env:
          EMBEDDING_MODEL: bge-small
          RERANKER_MODEL: none
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: claude-opus-5
          GRADER_MODEL: claude-sonnet-5
        run: pytest tests/test_regression.py -v -m eval

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-eval-results
          path: evals_out/
